name: Docker CI/CD Pipeline

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven # Mempercepat proses unduh dependensi

      # 1. SATPAM CI: Jalankan tes dulu. Kalau gagal, berhenti di sini!
      - name: Run Tests
        run: ./mvnw clean test

      # 2. LOGIN DOCKER
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. BUILD & PUSH: Docker akan menjalankan multi-stage build milikmu
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/springboot-api:latest

      # 4. DEPLOY KE VPS (Sama seperti sebelumnya)
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 2228
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/springboot-api:latest
            docker stop backend-api || true
            docker rm backend-api || true
            docker run -d -p 8080:8080 --env-file ~/backend.env --name backend-api ${{ secrets.DOCKER_USERNAME }}/springboot-api:latest
            docker image prune -f