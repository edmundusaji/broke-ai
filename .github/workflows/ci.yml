name: Docker CI/CD Pipeline

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven # Mempercepat proses unduh dependensi

      # 1. SATPAM CI: Jalankan tes dulu. Kalau gagal, berhenti di sini!
      - name: Run Tests
        run: |
          chmod +x mvnw
          ./mvnw clean test

      # 2. LOGIN DOCKER
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. BUILD & PUSH: Docker akan menjalankan multi-stage build milikmu
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/springboot-api:latest

      # 4. DEPLOY KE VPS (Sama seperti sebelumnya)
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 2228
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/springboot-api:latest
            docker stop backend-api || true
            docker rm backend-api || true
            docker run -d -p 8080:8080 \
              --env-file ~/backend.env \
              -e APP_OFFLINE_SYNC_ENABLED=true \
              -e APP_OFFLINE_SYNC_REQUIRE_ENABLED=true \
              --name backend-api \
              ${{ secrets.DOCKER_USERNAME }}/springboot-api:latest

            LOGIN_RESPONSE=""
            for attempt in $(seq 1 30); do
              if LOGIN_RESPONSE=$(curl --fail --silent --show-error \
                -X POST http://127.0.0.1:8080/api/v1/auth/guest-login); then
                break
              fi
              sleep 2
            done

            ACCESS_TOKEN=$(printf '%s' "$LOGIN_RESPONSE" \
              | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
            if [ -z "$ACCESS_TOKEN" ]; then
              echo "Guest login smoke test did not return an access token."
              exit 1
            fi

            PULL_STATUS=$(curl --silent --show-error \
              --output /tmp/offline-sync-pull.json \
              --write-out '%{http_code}' \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              http://127.0.0.1:8080/api/v1/sync/pull)
            if [ "$PULL_STATUS" != "200" ]; then
              echo "Offline sync pull smoke test failed with HTTP $PULL_STATUS."
              cat /tmp/offline-sync-pull.json
              exit 1
            fi

            if grep -q 'SYNC_FEATURE_DISABLED' /tmp/offline-sync-pull.json; then
              echo "Offline sync is disabled after deployment."
              exit 1
            fi

            docker image prune -f
