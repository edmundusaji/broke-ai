# H2 for Test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Shut down hibernate validation
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# API Mock
gemini.api.key=DUMMY_KEY_UNTUK_TEST
gemini.api.base-url=http://localhost:8080/dummy/%s?key=${gemini.api.key}
gemini.api.models=gemini-test-primary,gemini-test-fallback

app.jwt.secret=test-secret-for-broke-ai-auth-tests
app.jwt.expiration-seconds=86400
app.notification-capture.enabled=true
app.notification-capture.confidence-threshold=0.80
