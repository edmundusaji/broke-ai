# --- Configure Local Server ---
spring.application.name=broke-ai
server.port=8080

# --- Configure local database ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Configure JPA ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true

# --- Configure database migrations ---
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# --- Configure AI ---
gemini.api.key=${GEMINI_API_KEY}
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta/models/%s:generateContent?key=${gemini.api.key}

# --- Fallback Models ---
gemini.api.models=gemini-3.6-flash,gemini-3.5-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-2.5-pro,gemini-2.5-flash,gemini-2.5-flash-lite

# --- Configure JWT ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS}

# Guest identities with no activity and no live sessions are removed after this period.
# The same 90-day duration must be reflected in the published privacy policy.
app.guest-cleanup.retention-days=${GUEST_RETENTION_DAYS:90}
app.guest-cleanup.cron=${GUEST_CLEANUP_CRON:0 30 3 * * *}

# Offline transaction sync is part of the active mobile contract. Keep an
# explicit environment override for emergency rollback without shipping a new
# backend build.
app.offline-sync.enabled=${APP_OFFLINE_SYNC_ENABLED:true}
# Set this to true in released environments so a contradictory disabled flag
# fails startup instead of leaving mobile mutations permanently pending.
app.offline-sync.require-enabled=${APP_OFFLINE_SYNC_REQUIRE_ENABLED:false}

# Automatic Android notification capture is rollout-gated and disabled by default.
app.notification-capture.enabled=${NOTIFICATION_CAPTURE_ENABLED:false}
app.notification-capture.confidence-threshold=${NOTIFICATION_CAPTURE_CONFIDENCE_THRESHOLD:0.80}
