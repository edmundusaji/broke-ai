# --- Configure Local Server ---
spring.application.name=broke-ai
server.port=8080

# --- Configure local database ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Configure JPA ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true

# --- Configure database migrations ---
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# --- Configure AI ---
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=

# --- Configure JWT ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS}

# Guest identities with no activity and no live sessions are removed after this period.
# The same 90-day duration must be reflected in the published privacy policy.
app.guest-cleanup.retention-days=${GUEST_RETENTION_DAYS:90}
app.guest-cleanup.cron=${GUEST_CLEANUP_CRON:0 30 3 * * *}
